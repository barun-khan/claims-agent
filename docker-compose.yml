services:
  policy-rules:
    build:
      context: .
      dockerfile: tools/policy_rules/Dockerfile
    ports:
      - "8080:8080"
    environment:
      MCP_TRANSPORT: http
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
